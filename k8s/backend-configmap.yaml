apiVersion: v1
kind: ConfigMap
metadata:
  name: backend-config
  namespace: vienna-thirstday
data:
  PORT: "4000"
  JWT_EXPIRES_IN: "7d"
  # Set this to the public URL of the frontend once you have one (e.g. an
  # Ingress host). It's only used for the backend's CORS allow-list; the
  # frontend itself talks to the backend through its own reverse proxy, not
  # directly, so this rarely needs to change.
  CORS_ORIGIN: "http://vienna-thirstday.local"
