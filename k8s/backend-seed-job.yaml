# One-off Jobs, not part of the normal rollout: run manually when needed.
#   kubectl apply -f k8s/backend-seed-job.yaml
#   kubectl logs job/backend-seed -n vienna-thirstday
#   kubectl delete job/backend-seed job/backend-import-xlsx -n vienna-thirstday
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-seed
  namespace: vienna-thirstday
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: ghcr.io/holzeis/vienna-thirstday-backend:latest
          command: ["node", "dist/db/seed.js"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: vienna-thirstday-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
# Imports every *-import.json file under backend/src/db/seed-data/ (one per
# season) in a single run - not just a single spreadsheet.
apiVersion: batch/v1
kind: Job
metadata:
  name: backend-import-xlsx
  namespace: vienna-thirstday
spec:
  backoffLimit: 0
  template:
    spec:
      restartPolicy: Never
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: import-xlsx
          image: ghcr.io/holzeis/vienna-thirstday-backend:latest
          command: ["node", "dist/db/import-xlsx-seed.js"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: vienna-thirstday-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
