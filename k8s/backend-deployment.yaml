apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: vienna-thirstday
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      # GHCR packages are private by default. If ghcr.io/holzeis/vienna-thirstday-backend
      # is private, create a pull secret first and uncomment this:
      #   kubectl create secret docker-registry ghcr-pull --namespace vienna-thirstday \
      #     --docker-server=ghcr.io --docker-username=<gh-username> \
      #     --docker-password=<PAT with read:packages>
      # imagePullSecrets:
      #   - name: ghcr-pull
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        # Applies any pending Drizzle migration before the app starts, on
        # every pod start - not just after a schema change. drizzle-orm's
        # migrator takes a Postgres advisory lock internally, so the two
        # replicas' initContainers racing during a rollout serialize safely;
        # with nothing pending it's a fast no-op. This is what makes it safe
        # for k8s/backend-migration-job.yaml to no longer be a required
        # manual step before restarting - see the README.
        - name: migrate
          image: ghcr.io/holzeis/vienna-thirstday-backend:latest
          command: ["node", "dist/db/migrate.js"]
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: vienna-thirstday-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      containers:
        - name: backend
          image: ghcr.io/holzeis/vienna-thirstday-backend:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: backend-config
            - secretRef:
                name: vienna-thirstday-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/health
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: vienna-thirstday
spec:
  selector:
    app: backend
  ports:
    - port: 4000
      targetPort: 4000
