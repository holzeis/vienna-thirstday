apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vienna-thirstday

resources:
  - namespace.yaml
  - postgres.yaml
  - backend-configmap.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml
  # secret.yaml is intentionally NOT listed here and is gitignored - see
  # secret.example.yaml for how to create it (copy to secret.yaml and fill in
  # real values, or create it directly with `kubectl create secret ...`).
  # Once it exists, uncomment the line below:
  # - secret.yaml
  # Only needed if you're exposing the app publicly via a Cloudflare Tunnel
  # instead of/alongside router port forwarding - see cloudflared.yaml for
  # the one-time Cloudflare-side setup this depends on.
  # - cloudflared.yaml

# Published by .github/workflows/docker-publish.yml on every push to main
# (as `latest` + the short commit SHA) and on vX.Y.Z tags (also that
# version) - swap newTag for a specific SHA/version to pin a deploy instead
# of always tracking latest.
images:
  - name: vienna-thirstday-backend
    newName: ghcr.io/holzeis/vienna-thirstday-backend
    newTag: latest
  - name: vienna-thirstday-frontend
    newName: ghcr.io/holzeis/vienna-thirstday-frontend
    newTag: latest
