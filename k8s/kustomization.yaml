apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: vienna-thursday

resources:
  - namespace.yaml
  - postgres.yaml
  - backend-configmap.yaml
  - backend-deployment.yaml
  - frontend-deployment.yaml
  - ingress.yaml
  # secret.yaml is intentionally NOT listed here and is gitignored - see
  # secret.example.yaml for how to create it (copy to secret.yaml and fill in
  # real values, or create it directly with `kubectl create secret ...`).
  # Once it exists, uncomment the line below:
  # - secret.yaml
  # Only needed if you're exposing the app publicly via a Cloudflare Tunnel
  # instead of/alongside router port forwarding - see cloudflared.yaml for
  # the one-time Cloudflare-side setup this depends on.
  # - cloudflared.yaml

# Point these at your own registry before deploying, e.g.:
#   images:
#     - name: vienna-thursday-backend
#       newName: registry.example.com/vienna-thursday-backend
#       newTag: "1.0.0"
images:
  - name: vienna-thursday-backend
    newTag: latest
  - name: vienna-thursday-frontend
    newTag: latest
