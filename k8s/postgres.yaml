apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: vienna-thirstday
  labels:
    app: postgres
spec:
  clusterIP: None
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
  namespace: vienna-thirstday
spec:
  serviceName: postgres
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      # postgres:16-alpine's own entrypoint normally starts as root and
      # drops to its "postgres" user (uid/gid 70 in the alpine image - 999
      # on the Debian-based image, don't mix those up) itself before ever
      # touching the data directory, so the files on the PVC are already
      # owned by uid 70 regardless. Setting runAsUser/runAsGroup here skips
      # that root step entirely (confirmed locally: initdb and normal
      # startup both work running directly as 70:70, no root needed at any
      # point) - fsGroup makes kubelet fix up the PVC's *group* ownership to
      # match on mount, which is what makes this safe to roll out onto the
      # existing volume rather than only a fresh one.
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - containerPort: 5432
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          env:
            - name: POSTGRES_USER
              value: vienna
            - name: POSTGRES_DB
              value: vienna_thirstday
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vienna-thirstday-secrets
                  key: POSTGRES_PASSWORD
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "vienna", "-d", "vienna_thirstday"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "vienna", "-d", "vienna_thirstday"]
            initialDelaySeconds: 15
            periodSeconds: 20
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        storageClassName: longhorn
        resources:
          requests:
            storage: 5Gi
