# Example Secret manifest - DO NOT commit real secrets to git.
#
# Copy this file to secret.yaml, fill in real values, and apply it, OR
# generate it directly with:
#
#   kubectl create secret generic vienna-thirstday-secrets \
#     --namespace vienna-thirstday \
#     --from-literal=POSTGRES_PASSWORD='use-a-strong-password' \
#     --from-literal=DATABASE_URL='postgresql://vienna:use-a-strong-password@postgres:5432/vienna_thirstday' \
#     --from-literal=JWT_SECRET='generate-a-long-random-string' \
#     --from-literal=ADMIN_PASSWORD='choose-a-first-admin-password' \
#     --from-literal=ADMIN_NAME='Admin' \
#     --from-literal=CLOUDFLARE_TUNNEL_TOKEN='token-from-the-cloudflare-dashboard'
#
# NOTE: POSTGRES_PASSWORD and the password embedded in DATABASE_URL must match.
# ADMIN_EMAIL is optional - login is by name, not email; only set it if you
# want the seeded admin account to have contact info attached from the start.
# CLOUDFLARE_TUNNEL_TOKEN is only needed if you're applying cloudflared.yaml
# to expose the app publicly - see that file for the one-time setup steps.
apiVersion: v1
kind: Secret
metadata:
  name: vienna-thirstday-secrets
  namespace: vienna-thirstday
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  DATABASE_URL: "postgresql://vienna:change-me@postgres:5432/vienna_thirstday"
  JWT_SECRET: "generate-a-long-random-string"
  ADMIN_PASSWORD: "changeme123"
  ADMIN_NAME: "Admin"
  CLOUDFLARE_TUNNEL_TOKEN: "token-from-the-cloudflare-dashboard"
