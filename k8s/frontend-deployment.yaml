apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: vienna-thursday
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: vienna-thursday-frontend:latest
          ports:
            - containerPort: 80
          env:
            # DNS name of the backend Service defined in backend-deployment.yaml
            - name: BACKEND_HOST
              value: "backend:4000"
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 10
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 128Mi
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: vienna-thursday
spec:
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
