name: Build and publish images

# Runs the backend and frontend tests and builds both apps, then builds backend/ and
# frontend/ into Docker images and pushes them to GHCR. The image build waits
# for the `test` job, so a red test run never publishes. On every pull request
# both images are built (catches a broken Dockerfile before merge) - images are pushed only from main (never from
# PRs, other branches or tags). Pushing to main publishes `latest`. Every pushed image is also tagged with the git
# commit count of the commit it was built from (`git rev-list --count HEAD`,
# e.g. `:482`) - a monotonically increasing version number, also baked into
# the frontend as VITE_APP_VERSION and set as the OCI version label.
#
# On pushes to main, each component is only built when its own directory (or
# this workflow) changed - the `changes` job diffs the push and feeds the
# build matrix. Pull requests always build both.
# A skipped component keeps its previous `latest`, and simply has no
# commit-count tag for commits that didn't touch it.
#
# Images land at ghcr.io/<owner>/<repo>-<component>, using the built-in
# GITHUB_TOKEN - no extra secrets to set up. GHCR packages are private by
# default: if you keep them private, the cluster pulling these images needs
# an imagePullSecret; making the packages public in
# their GitHub settings avoids that.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # The integration tests need a real Postgres; globalSetup.ts runs the
    # migrations against it, so the database only has to exist.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: vienna
          POSTGRES_PASSWORD: vienna
          POSTGRES_DB: vienna_thirstday_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U vienna"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql://vienna:vienna@localhost:5432/vienna_thirstday_test
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json

      - name: Backend - install, build, test
        working-directory: backend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm test

      - name: Frontend - install, build, test
        working-directory: frontend
        run: |
          npm ci --legacy-peer-deps
          npm run build
          npm test

  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      components: ${{ steps.components.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-publish.yml'

      - name: Build component list
        id: components
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          IS_PR: ${{ github.event_name == 'pull_request' }}
        run: |
          list=()
          if [ "$IS_PR" = "true" ] || [ "$BACKEND" = "true" ]; then list+=('"backend"'); fi
          if [ "$IS_PR" = "true" ] || [ "$FRONTEND" = "true" ]; then list+=('"frontend"'); fi
          echo "value=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: [test, changes]
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the build number below is meaningful

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ steps.build_number.outputs.value }},enable=${{ github.ref == 'refs/heads/main' }}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.build_number.outputs.value }}

      - name: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' && 'Build and push' || 'Build (not pushed)' }}
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.component == 'frontend' && format('VITE_APP_VERSION={0}', steps.build_number.outputs.value) || '' }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
