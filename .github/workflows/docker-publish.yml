name: Build and publish images

# Builds backend/ and frontend/ into Docker images and
# pushes them to GHCR. On pull requests it only builds (catches a broken
# Dockerfile before merge) - nothing is pushed until the change lands on
# main. Pushing to main publishes `latest`; pushing a `vX.Y.Z` tag also
# publishes that version. Every pushed image is also tagged with the git
# commit count of the commit it was built from (`git rev-list --count HEAD`,
# e.g. `:482`) - a monotonically increasing version number, also baked into
# the frontend as VITE_APP_VERSION and set as the OCI version label.
#
# Each component is only built when its own directory (or this workflow)
# changed - the `changes` job diffs the push/PR and feeds the build matrix.
# A `vX.Y.Z` tag always builds both so a release has a matching image for
# each component. A skipped component keeps its previous `latest`, and
# simply has no commit-count tag for commits that didn't touch it.
#
# Images land at ghcr.io/<owner>/<repo>-<component>, using the built-in
# GITHUB_TOKEN - no extra secrets to set up. GHCR packages are private by
# default: if you keep them private, the cluster pulling these images needs
# an imagePullSecret; making the packages public in
# their GitHub settings avoids that.

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read # paths-filter lists PR files through the API
    outputs:
      components: ${{ steps.components.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Detect changed components
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/docker-publish.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/docker-publish.yml'

      - name: Build component list
        id: components
        env:
          BACKEND: ${{ steps.filter.outputs.backend }}
          FRONTEND: ${{ steps.filter.outputs.frontend }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/') }}
        run: |
          list=()
          if [ "$IS_TAG" = "true" ] || [ "$BACKEND" = "true" ]; then list+=('"backend"'); fi
          if [ "$IS_TAG" = "true" ] || [ "$FRONTEND" = "true" ]; then list+=('"frontend"'); fi
          echo "value=[$(IFS=,; echo "${list[*]}")]" >> "$GITHUB_OUTPUT"

  build-and-push:
    needs: changes
    if: needs.changes.outputs.components != '[]'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: ${{ fromJSON(needs.changes.outputs.components) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, so the build number below is meaningful

      - name: Compute build number
        id: build_number
        run: echo "value=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image metadata (tags/labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}-${{ matrix.component }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=raw,value=${{ steps.build_number.outputs.value }},enable=${{ github.event_name != 'pull_request' }}
            type=sha,prefix=,format=short
          labels: |
            org.opencontainers.image.version=${{ steps.build_number.outputs.value }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.component }}
          platforms: linux/amd64,linux/arm64
          build-args: ${{ matrix.component == 'frontend' && format('VITE_APP_VERSION={0}', steps.build_number.outputs.value) || '' }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.component }}
          cache-to: type=gha,mode=max,scope=${{ matrix.component }}
