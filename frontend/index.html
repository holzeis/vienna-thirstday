<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#fff1e6" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#1c1230" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Vienna Thirstday" />
    <meta name="description" content="Every Thursday in Vienna — gamedays, standings, and sign-ups." />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("vt-theme");
          var theme =
            stored || (window.matchMedia && window.matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (e) {
          /* localStorage unavailable, fall back to default dark theme */
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <title>Vienna Thirstday</title>
    <style>
      /*
        Shown the instant the page paints, before the JS bundle (and its own
        CSS) has loaded - so these colors are duplicated from index.css's
        tokens rather than referenced, and this whole block is removed for
        free once React mounts and replaces #root's contents.
      */
      #app-preload {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        background: linear-gradient(160deg, #1c1230 0%, #3a1a3d 100%);
      }
      :root[data-theme="light"] #app-preload {
        background: linear-gradient(160deg, #fff7ec 0%, #ffe3d1 100%);
      }
      #app-preload svg {
        width: 72px;
        height: 72px;
        animation: app-preload-spin 1.4s linear infinite;
      }
      #app-preload .pl-dark {
        display: block;
      }
      #app-preload .pl-light {
        display: none;
      }
      :root[data-theme="light"] #app-preload .pl-dark {
        display: none;
      }
      :root[data-theme="light"] #app-preload .pl-light {
        display: block;
      }
      #app-preload span {
        font-family: "Baloo 2", "Segoe UI", sans-serif;
        font-weight: 800;
        font-size: 20px;
        color: #fbeee8;
      }
      :root[data-theme="light"] #app-preload span {
        color: #3a2418;
      }
      @keyframes app-preload-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="app-preload">
        <svg class="pl-light" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl-ring-l" gradientUnits="userSpaceOnUse" x1="15" y1="185" x2="185" y2="15">
              <stop offset="0" stop-color="#ff7a45" />
              <stop offset="1" stop-color="#ff5da2" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="url(#pl-ring-l)" stroke-width="12" />
          <circle cx="100" cy="100" r="54" fill="none" stroke="#3a2418" stroke-width="5" />
          <polygon points="100.00,73.00 125.68,91.66 115.87,121.84 84.13,121.84 74.32,91.66" fill="#3a2418" />
          <line x1="100.00" y1="71.00" x2="100.00" y2="57.00" stroke="#3a2418" stroke-width="4" stroke-linecap="round" />
          <line x1="127.58" y1="91.04" x2="140.90" y2="86.71" stroke="#3a2418" stroke-width="4" stroke-linecap="round" />
          <line x1="117.05" y1="123.46" x2="125.27" y2="134.79" stroke="#3a2418" stroke-width="4" stroke-linecap="round" />
          <line x1="82.95" y1="123.46" x2="74.73" y2="134.79" stroke="#3a2418" stroke-width="4" stroke-linecap="round" />
          <line x1="72.42" y1="91.04" x2="59.10" y2="86.71" stroke="#3a2418" stroke-width="4" stroke-linecap="round" />
        </svg>
        <svg class="pl-dark" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="pl-ring-d" gradientUnits="userSpaceOnUse" x1="15" y1="185" x2="185" y2="15">
              <stop offset="0" stop-color="#ff8a5c" />
              <stop offset="1" stop-color="#c15cff" />
            </linearGradient>
          </defs>
          <circle cx="100" cy="100" r="88" fill="none" stroke="url(#pl-ring-d)" stroke-width="12" />
          <circle cx="100" cy="100" r="54" fill="none" stroke="#fbeee8" stroke-width="5" />
          <polygon points="100.00,73.00 125.68,91.66 115.87,121.84 84.13,121.84 74.32,91.66" fill="#fbeee8" />
          <line x1="100.00" y1="71.00" x2="100.00" y2="57.00" stroke="#fbeee8" stroke-width="4" stroke-linecap="round" />
          <line x1="127.58" y1="91.04" x2="140.90" y2="86.71" stroke="#fbeee8" stroke-width="4" stroke-linecap="round" />
          <line x1="117.05" y1="123.46" x2="125.27" y2="134.79" stroke="#fbeee8" stroke-width="4" stroke-linecap="round" />
          <line x1="82.95" y1="123.46" x2="74.73" y2="134.79" stroke="#fbeee8" stroke-width="4" stroke-linecap="round" />
          <line x1="72.42" y1="91.04" x2="59.10" y2="86.71" stroke="#fbeee8" stroke-width="4" stroke-linecap="round" />
        </svg>
        <span>Vienna Thirstday</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
