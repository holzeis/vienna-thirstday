services:
  postgres:
    image: postgres:16-alpine
    # Not hardened with cap_drop/no-new-privileges here: the official
    # image's entrypoint needs to chown/chmod the data dir on first start
    # (confirmed - dropping all capabilities breaks that with "Operation not
    # permitted"), which it does as root before dropping to the postgres
    # user itself. This is local-only dev/test infra, not internet-facing -
    # see k8s/postgres.yaml for how the real cluster deployment avoids
    # running this image as root at all (runAsUser/fsGroup) instead of
    # fighting its entrypoint's own privilege-drop dance.
    environment:
      POSTGRES_USER: vienna
      POSTGRES_PASSWORD: vienna
      POSTGRES_DB: vienna_thirstday
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vienna -d vienna_thirstday"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      DATABASE_URL: postgresql://vienna:vienna@postgres:5432/vienna_thirstday
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://0.0.0.0:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vienna-thirstday.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Dev-only default keypair - generate your own with `npx web-push generate-vapid-keys`
      # for a real deployment (see README's Kubernetes section).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BP-fntKYVjb37_d9gS7J0Ge5LY-d9o1ESL8sP31YKCbJXMycI2iac8QicUoVx4x8QBsqVJeQzdF94wbDNmTKzYM}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-OqWihO3pMNLWoQ4VfUcCJonvsGz4YManL_1m_FiLS0w}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@vienna-thirstday.local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    # Run pending migrations before starting the API on every container start.
    # Seeding the first admin / importing legacy data are one-off steps - see
    # the README for `docker compose run --rm backend node dist/db/seed.js`.
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
        VITE_APP_VERSION: ${VITE_APP_VERSION:-dev}
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    environment:
      BACKEND_HOST: backend:4000
    depends_on:
      - backend
    ports:
      - "8080:8080"

  metabase:
    image: metabase/metabase:v0.63.16.6
    # Not hardened with cap_drop/no-new-privileges: same story as postgres
    # above - the official image's entrypoint creates its own "metabase" user
    # and drops to it via adduser/su on every start (confirmed - cap_drop:ALL
    # breaks that with "Operation not permitted"), so it needs those
    # capabilities for the few seconds before it drops root itself. Local-only
    # convenience tool, not internet-facing, so that's an acceptable tradeoff.
    environment:
      MB_DB_FILE: /metabase-data/metabase.db
    volumes:
      - metabase-data:/metabase-data
    ports:
      - "3000:3000"
    # Metabase's own dashboards/settings live in the embedded H2 file above -
    # separate from the app's data. Add the actual vienna_thirstday database
    # as a data source from the Metabase UI after first run, using the
    # read-only role from backend/scripts/setup-metabase-role.sql (see
    # README's "Usage metrics" section) rather than the app's own credentials.

volumes:
  pgdata:
  metabase-data:
