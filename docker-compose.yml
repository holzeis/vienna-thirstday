services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: vienna
      POSTGRES_PASSWORD: vienna
      POSTGRES_DB: vienna_thirstday
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vienna -d vienna_thirstday"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgresql://vienna:vienna@postgres:5432/vienna_thirstday
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
      JWT_EXPIRES_IN: 7d
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN:-http://0.0.0.0:8080}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@vienna-thirstday.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-changeme123}
      ADMIN_NAME: ${ADMIN_NAME:-Admin}
      # Dev-only default keypair - generate your own with `npx web-push generate-vapid-keys`
      # for a real deployment (see README's Kubernetes section).
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-BP-fntKYVjb37_d9gS7J0Ge5LY-d9o1ESL8sP31YKCbJXMycI2iac8QicUoVx4x8QBsqVJeQzdF94wbDNmTKzYM}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-OqWihO3pMNLWoQ4VfUcCJonvsGz4YManL_1m_FiLS0w}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:admin@vienna-thirstday.local}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "4000:4000"
    # Run pending migrations before starting the API on every container start.
    # Seeding the first admin / importing legacy data are one-off steps - see
    # the README for `docker compose run --rm backend node dist/db/seed.js`.
    command: sh -c "node dist/db/migrate.js && node dist/index.js"

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: /api
    environment:
      BACKEND_HOST: backend:4000
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
